[package]
name = "tacit-wallet"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tacit-vault = { path = "../tacit-vault" }
zcash_client_backend = { version = "0.24.0", features = ["orchard", "pczt", "lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots", "sync"] }
zcash_client_sqlite = { version = "0.22.0", features = ["orchard", "multicore", "transparent-inputs", "serde"] }
zcash_primitives = "0.30.1"
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zcash_keys = { version = "0.16.1", features = ["orchard", "unstable-frost"] }
pczt = { version = "0.9.3", features = ["orchard", "prover", "tx-extractor", "signer"] }
orchard = "0.15"
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
hex = "0.4"
rusqlite = "0.37"
secrecy = "0.8"
async-trait = "0.1"
zip32 = "0.2"
zip321 = "0.9"
ureq = "3"
serde_json = "1"
zcash_address = "0.13"
tacit-core = { path = "../tacit-core" }
tacit-regtest = { path = "../tacit-regtest" }
tacit-coordinator = { path = "../tacit-coordinator" }
tacit-light = { path = "../tacit-light" }
