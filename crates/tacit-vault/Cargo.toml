[package]
name = "tacit-vault"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
frost-core = "3"
frost-rerandomized = "3"
orchard = { version = "0.15", features = ["unstable-frost"] }
pczt = { version = "0.9.3", features = ["signer", "orchard", "prover", "tx-extractor"] }
reddsa = { version = "=0.5.2", features = ["frost"] }
zcash_primitives = "0.30.1"
zcash_protocol = "0.10"
zcash_keys = { version = "0.16.1", features = ["orchard", "unstable-frost"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
thiserror = "2"
hex = "0.4"
pasta_curves = "0.5"

