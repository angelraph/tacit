[package]
name = "tacit-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tacit-core = { path = "../tacit-core", features = ["serde"] }
tacit-light = { path = "../tacit-light" }
tacit-vault = { path = "../tacit-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bip39 = "2"
console_error_panic_hook = "0.1"
orchard = { version = "0.15", default-features = false, features = ["circuit", "std"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Window"] }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
# Multithreaded proving in the browser. Needs a nightly build with atomics
# (see spikes/wasm-bench/build-threads.sh) and a cross-origin isolated page.
threads = ["dep:wasm-bindgen-rayon", "orchard/multicore", "tacit-light/parallel"]
