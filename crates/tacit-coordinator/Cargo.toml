[package]
name = "tacit-coordinator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tacit-core = { path = "../tacit-core", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ureq = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
zcash_client_backend = { version = "0.24.0", default-features = false, features = ["lightwalletd-tonic-transport", "lightwalletd-tonic-tls-webpki-roots"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
